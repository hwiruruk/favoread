  <script>
  document.querySelectorAll(".copy-btn").forEach(function (b) {
    b.addEventListener("click", function () {
      var u = b.dataset.url, was = b.textContent;
      function done() {
        b.textContent = b.dataset.done; b.classList.add("done");
        setTimeout(function () { b.textContent = was; b.classList.remove("done"); }, 1600);
      }
      function fallback() {
        var ta = document.createElement("textarea");
        ta.value = u; ta.style.cssText = "position:fixed;top:-9999px;left:-9999px";
        document.body.appendChild(ta); ta.focus(); ta.select();
        try { document.execCommand("copy"); done(); } catch (e) { prompt(was, u); }
        document.body.removeChild(ta);
      }
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(u).then(done, fallback);
      } else { fallback(); }
    });
  });
  </script>
