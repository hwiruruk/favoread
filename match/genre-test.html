<style>
  :root { --yl:#fde047; --pk:#ff8cc6; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg,#fff); color:var(--ink,#111); font-family:-apple-system,"Pretendard","Noto Sans KR",sans-serif; line-height:1.5; }
  .wrap { max-width:720px; margin:0 auto; padding:0 16px 80px; }
  .test { background:#111; color:#fff; font-size:12px; padding:8px 16px; text-align:center; }
  h1 { font-size:26px; margin:26px 0 6px; line-height:1.25; }
  .lead { margin:0 0 16px; }
  .box { border:1px solid var(--border,#111); padding:16px; margin:16px 0; background:var(--bg,#fff); }
  .btn { display:block; width:100%; padding:14px; font-size:16px; font-weight:800; background:var(--yl); color:#111; border:1px solid #111; cursor:pointer; margin-top:14px; }
  .btn.ghost { background:transparent; color:inherit; font-size:14px; padding:10px; }
  .hide { display:none !important; }
  .prog { display:flex; align-items:center; gap:10px; font-weight:800; font-size:14px; }
  .prog-bar { flex:1; height:8px; border:1px solid #111; }
  .prog-bar i { display:block; height:100%; width:0; background:var(--pk); transition:width .3s; }
  .rd { margin:10px 0 0; font-size:13px; opacity:.7; }
  .vs { display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-top:14px; position:relative; }
  .vs::after { content:"VS"; position:absolute; left:50%; top:50%; transform:translate(-50%,-50%); background:#111; color:#fff; font-weight:900; font-size:13px; padding:6px 8px; border-radius:50%; }
  .gc { border:2px solid #111; background:var(--bg,#fff); padding:12px 10px; cursor:pointer; text-align:center; color:inherit; font:inherit; transition:transform .15s, opacity .15s; }
  .gc:hover { transform:translateY(-2px); }
  .gc .cv { display:flex; justify-content:center; gap:6px; margin-bottom:10px; }
  .gc img { width:44%; aspect-ratio:2/3; object-fit:cover; border:1px solid #111; background:#eee; }
  .gc b { display:block; font-size:20px; }
  .gc small { display:block; font-size:12px; opacity:.75; margin-top:2px; }
  .gc.won { background:var(--yl); color:#111; } .gc.lost { opacity:.3; }
  h2 { font-size:18px; margin:22px 0 0; }
  .hl { border:2px solid #111; background:var(--yl); color:#111; padding:18px; text-align:center; }
  .hl-tag { font-size:13px; font-weight:800; } .hl-name { font-size:30px; font-weight:900; margin:4px 0; } .hl-sub { font-size:14px; }
  .my { display:flex; flex-wrap:wrap; gap:6px; margin:10px 0 0; }
  .chip { border:1px solid #111; padding:3px 10px; font-size:13px; font-weight:800; }
  .chip.c1 { background:var(--pk); color:#111; }
  .res { display:flex; gap:12px; align-items:center; }
  .rank { font-weight:900; font-size:22px; width:26px; }
  .pic { width:64px; height:64px; border-radius:50%; object-fit:cover; background:#eee; border:1px solid #111; flex:none; }
  .res h3 { margin:0; font-size:17px; } .res h3 a { color:inherit; }
  .pct2 { font-weight:900; margin-left:6px; }
  .bar { display:flex; height:14px; border:1px solid #111; margin:8px 0 4px; }
  .bar span { display:block; height:100%; }
  .leg { list-style:none; display:flex; flex-wrap:wrap; gap:2px 10px; margin:0; padding:0; font-size:12px; }
  .leg i { display:inline-block; width:9px; height:9px; margin-right:4px; border:1px solid #111; }
  .note { font-size:12px; opacity:.7; margin-top:6px; }
</style>
</head>

<div class="test">🧪 테스트 버전 — 아직 사이트에 연결되지 않은 시안이에요 (분야 정보가 있는 셀럽 201명 기준)</div>

  <section id="cup" class="box">
    <div id="intro">
      <b style="font-size:18px">분야 월드컵 8강</b>
      <p style="margin:8px 0 0">두 분야 중 더 끌리는 쪽을 고르면 돼요. 결승까지 가면 나의 분야 취향이 나와요.</p>
      <button class="btn" id="start">분야 월드컵 시작하기</button>
    </div>
    <div id="play" class="hide">
      <div class="prog"><span id="no"></span><div class="prog-bar"><i id="bar"></i></div></div>
      <p class="rd" id="rd"></p>
      <div class="vs" id="vs"></div>
    </div>
  </section>

  <div id="out"></div>
</main>

  function shuffle(a) { a = a.slice(); for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)); var t = a[i]; a[i] = a[j]; a[j] = t; } return a; }
  function start() {
    queue = shuffle(D.genres.map(function (g) { return g.g; })); next = []; wins = {}; step = 0; total = 7;
    D.genres.forEach(function (g) { wins[g.g] = 0; });
    $('out').innerHTML = ''; $('intro').classList.add('hide'); $('play').classList.remove('hide'); show();
  }
  function show() {
    if (queue.length < 2) {
      if (next.length === 1) return finish(next[0]);
      queue = shuffle(next); next = [];
    }
    pair = [queue.shift(), queue.shift()]; locked = false;
    var left = queue.length / 2 + next.length + 1;          // 이번 라운드 남은 경기 수 (현재 포함)
    var size = (queue.length + 2 + next.length * 2);
    $('rd').textContent = size > 4 ? ROUND[0] : size > 2 ? ROUND[1] : ROUND[2];
    $('no').textContent = (step + 1) + ' / ' + total;
    $('bar').style.width = (step / total * 100) + '%';
    $('vs').innerHTML = pair.map(function (g, i) {
      var o = byG[g];
      return '<button class="gc" data-i="' + i + '"><div class="cv">' + o.c.map(function (u) { return '<img src="' + esc(u) + '" alt="" referrerpolicy="no-referrer" loading="lazy">'; }).join('') + '</div><b>' + esc(g) + '</b><small>' + esc(o.d) + '</small></button>';
    }).join('');
  }
  $('vs').addEventListener('click', function (e) {
    var t = e.target.closest('.gc'); if (!t || locked) return; locked = true;
    var i = +t.getAttribute('data-i'), cards = $('vs').children;
    cards[i].classList.add('won'); cards[1 - i].classList.add('lost');
    wins[pair[i]]++; next.push(pair[i]); step++;
    setTimeout(show, 420);
  });
  $('start').onclick = start;

  function finish(champ) {
    $('bar').style.width = '100%';
    $('play').classList.add('hide'); $('intro').classList.remove('hide');
    $('start').textContent = '분야 월드컵 다시 하기';
    // 승수가 내 취향 점수: 우승 3 · 준우승 2 · 4강 탈락 1 · 나머지 0 (+작은 값으로 동점 방지)
    var me = {}, sum = 0;
    D.genres.forEach(function (g) { me[g.g] = wins[g.g] + 0.15; sum += me[g.g]; });
    var order = D.genres.map(function (g) { return g.g; }).sort(function (a, b) { return wins[b] - wins[a]; });
    // 셀럽 분야 비율을 사이트 평균으로 나눈 '눈에 띄는 정도'와 내 점수를 코사인으로 비교
    var avg = D.avg, keys = Object.keys(avg);
    var rows = D.celebs.map(function (c) {
      var dot = 0, a = 0, b = 0;
      keys.forEach(function (g) {
        var x = (me[g] || 0), y = (c.r[g] || 0) / (avg[g] || 0.01);
        dot += x * y; a += x * x; b += y * y;
      });
      var top = Object.keys(c.r).sort(function (p, q) { return c.r[q] - c.r[p]; });
      return { c: c, s: dot / Math.sqrt((a || 1) * (b || 1)), top: top };
    }).sort(function (x, y) { return y.s - x.s; });
    var top1 = rows[0], p1 = Math.round(top1.s * 100);
    var legend = function (c) {
      var gs = Object.keys(c.r).sort(function (p, q) { return c.r[q] - c.r[p]; });
      return '<div class="bar">' + gs.map(function (g) { return '<span title="' + esc(g) + '" style="flex:' + c.r[g] + ' 0 0;background:' + (COLOR[g] || '#e5e5e5') + '"></span>'; }).join('') + '</div>' +
        '<ul class="leg">' + gs.slice(0, 4).map(function (g) { return '<li><i style="background:' + (COLOR[g] || '#e5e5e5') + '"></i>' + esc(g) + ' ' + Math.round(c.r[g] * 100) + '%</li>'; }).join('') + '</ul>';
    };
    $('out').innerHTML =
      '<div class="hl"><div class="hl-tag">나의 분야 취향 · ' + esc(champ) + '파 📚</div><div class="hl-name">' + esc(top1.c.n) + '</div><div class="hl-sub">분야 취향이 가장 비슷한 셀럽이에요 · 궁합 <b>' + p1 + '%</b></div></div>' +
      '<div class="my">' + order.slice(0, 3).map(function (g, i) { return '<span class="chip' + (i === 0 ? ' c1' : '') + '">' + (i + 1) + '위 ' + esc(g) + '</span>'; }).join('') + '</div>' +
      '<h2>취향 비슷한 셀럽 TOP 5</h2>' +
      rows.slice(0, 5).map(function (r, i) {
        return '<article class="box"><div class="res"><div class="rank">' + (i + 1) + '</div>' +
          (r.c.i ? '<img class="pic" src="' + esc(r.c.i) + '" alt="' + esc(r.c.n) + '" loading="lazy" referrerpolicy="no-referrer">' : '<div class="pic"></div>') +
          '<div style="flex:1"><h3><a href="' + esc(r.c.u) + '">' + esc(r.c.n) + '</a><span class="pct2">' + Math.round(r.s * 100) + '%</span></h3>' +
          '<div class="note" style="margin:0">책 ' + r.c.k + '권 기준 · ' + esc(r.top[0]) + ' ' + Math.round(r.c.r[r.top[0]] * 100) + '%</div></div></div>' + legend(r.c) + '</article>';
      }).join('') +
      '<p class="note">궁합은 사이트 평균보다 더 많이 읽는 분야를 기준으로 계산해요. 분야 정보가 있는 책이 5권 이상인 셀럽만 포함돼요.</p>';
    $('out').scrollIntoView({ behavior: 'smooth' });
  }
})();
</script>
</body>
</html>
