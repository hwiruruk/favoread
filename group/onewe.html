  <script>
  (function () {
    var chips = document.querySelectorAll(".gm"), cards = document.querySelectorAll(".gb"),
        pick = document.getElementById("pick"), head = document.getElementById("books-h");
    function show(m, name, url) {
      var n = 0;
      cards.forEach(function (c) {
        var ok = m === "" || c.getAttribute("data-r").indexOf(" " + m + " ") > -1;
        c.hidden = !ok; if (ok) n++;
      });
      chips.forEach(function (b) {
        var on = b.getAttribute("data-m") === m;
        b.classList.toggle("on", on); b.setAttribute("aria-pressed", on);
      });
      head.textContent = m === "" ? "멤버들이 읽은 책" : name + " · 읽은 책 " + n + "권";
      if (m === "") { pick.className = "pick"; pick.textContent = ""; return; }
      pick.className = "pick show";
      pick.innerHTML = "";
      var a = document.createElement("a"); a.href = url; a.textContent = name + " 페이지에서 출처와 코멘트 보기 →";
      pick.appendChild(a);
    }
    chips.forEach(function (b) {
      b.addEventListener("click", function () {
        var m = b.getAttribute("data-m");
        show(m, b.getAttribute("data-name"), b.getAttribute("data-url"));
        try { history.replaceState(null, "", m === "" ? location.pathname : "#" + encodeURIComponent(b.getAttribute("data-name"))); } catch (e) {}
      });
    });
    var h = decodeURIComponent(location.hash.slice(1));
    if (h) chips.forEach(function (b) { if (b.getAttribute("data-name") === h) b.click(); });
  })();
  </script>
