name: Polish Book Comments

# 편집기 '💬 코멘트 검수' 창에서 적어둔 '내 메모'를 Claude 가 한국어·영어 한 줄로 다듬는다.
# 매일 아침 저절로 돌고, 편집기의 '✨ AI로 다듬기' 버튼이나
# GitHub 웹의 Actions → 이 워크플로 → "Run workflow" 로 바로 돌릴 수도 있다.
#
# 다듬은 문장은 승인 전(status: pending)이라 사이트에 안 나간다.
# 그래서 PR 없이 바로 커밋하고, 사람은 검수 창에서 읽어보고 승인만 한다.
#
# Secret:
#   ANTHROPIC_API_KEY   필수. 없으면 아무것도 안 하고 끝난다
# 자세한 설명은 tools/COMMENTS.md 참고.

on:
  schedule:
    # 매일 한국 시간 오전 6시 47분 (UTC 21:47). 정각은 붐벼서 늦게 돌 수 있다.
    - cron: '47 21 * * *'
  workflow_dispatch:
    inputs:
      limit:
        description: '이번에 다듬을 항목 수 (0 = 전부)'
        required: false
        default: '50'
      dry_run:
        description: '연습 모드 — 결과만 보고 파일은 안 바꿈'
        required: false
        default: false
        type: boolean
      only:
        description: '이 항목만 ("연예인|도서명", 쉼표로 여러 개)'
        required: false
        default: ''

concurrency:
  group: polish-comments
  cancel-in-progress: false

jobs:
  polish:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install Anthropic SDK
        run: pip install anthropic

      - name: 메모를 문장으로 다듬기
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          IN_LIMIT: ${{ github.event.inputs.limit }}
          IN_DRY: ${{ github.event.inputs.dry_run }}
          IN_ONLY: ${{ github.event.inputs.only }}
        run: |
          ARGS=(--save-results "$RUNNER_TEMP/polished.json")
          LIMIT="${IN_LIMIT:-50}"
          if [ -n "$LIMIT" ] && [ "$LIMIT" != "0" ]; then ARGS+=(--limit "$LIMIT"); fi
          if [ "$IN_DRY" = "true" ]; then ARGS+=(--dry-run); fi
          if [ -n "$IN_ONLY" ]; then ARGS+=(--only "$IN_ONLY"); fi
          echo "실행: python3 tools/polish_comments.py ${ARGS[*]}"
          python3 tools/polish_comments.py "${ARGS[@]}"

      - name: 커밋
        run: |
          if git diff --quiet -- data/comments.json; then
            echo "바뀐 내용이 없습니다 (다듬을 메모가 없었거나 연습 모드)."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          MSG="chore: 코멘트 메모 AI 다듬기 [$(date +%Y-%m-%d)]"
          git add data/comments.json
          git commit -m "$MSG"
          # 그사이 편집기 저장이나 다른 봇이 먼저 올렸으면, 최신 파일을 받아
          # API 를 다시 부르지 않고 저장해 둔 결과만 얹는다 (JSON 을 rebase 로 합치지 않는다).
          for i in 1 2 3 4; do
            git push origin "HEAD:${GITHUB_REF_NAME}" && exit 0
            sleep $((i * 5))
            git fetch origin "${GITHUB_REF_NAME}"
            git reset --hard "origin/${GITHUB_REF_NAME}"
            python3 tools/polish_comments.py --apply "$RUNNER_TEMP/polished.json"
            git diff --quiet -- data/comments.json && { echo "다시 적용할 게 없습니다."; exit 0; }
            git add data/comments.json
            git commit -m "$MSG"
          done
          exit 1
