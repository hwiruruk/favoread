name: Enrich English Names (celebs only)

# 셀럽 영문 이름(연예인_en) 제안만 한다. 제안값엔 `?` 접두사가 붙어 검수 전에는 사이트에 안 나간다.
#
# ※ 책 영문 제목은 여기서 하지 않는다 → "Fetch English Titles" 워크플로 + 편집기 '🔤 영문 제목 검수'
#   (tools/TITLES_EN.md). 예전에 이 워크플로가 하던 책 제목 조회는 한국어 제목으로 영어 책을
#   검색하는 방식이라 181권을 조회해 한 권도 못 찾았다(2026-09-23 실행 로그). 그래서 뺐다.

on:
  workflow_dispatch:
    inputs:
      limit:
        description: '최대 처리 셀럽 수 (0=무제한)'
        required: false
        default: '0'
      refresh:
        description: '?접두사 제안값도 다시 조회'
        required: false
        default: 'false'
        type: boolean
  schedule:
    # 매월 1일 02:00 UTC (KST 11:00) — 새로 추가된 셀럽의 영문 이름 자동 제안
    - cron: '0 2 1 * *'

jobs:
  enrich:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Run enricher
        run: |
          ARGS="--skip-books --sleep 1.0"
          if [ "${{ github.event.inputs.limit }}" != "" ] && [ "${{ github.event.inputs.limit }}" != "0" ]; then
            ARGS="$ARGS --celeb-limit ${{ github.event.inputs.limit }}"
          fi
          if [ "${{ github.event.inputs.refresh }}" = "true" ]; then
            ARGS="$ARGS --refresh"
          fi
          python3 enrich_en.py $ARGS

      - name: Check if data.csv changed
        id: diff
        run: |
          if git diff --quiet data.csv; then
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            echo "changed=true" >> $GITHUB_OUTPUT
          fi

      - name: Create Pull Request
        if: steps.diff.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v8
        with:
          commit-message: "chore: 셀럽 영문 이름 자동 제안 갱신"
          title: "chore: 셀럽 영문 이름 자동 제안 (검수 필요)"
          body: |
            ## 셀럽 영문 이름 자동 제안

            `enrich_en.py --skip-books` 가 한국어 위키백과 → Wikidata 에서 찾은 영문 이름입니다.
            제안값엔 `?` 접두사가 붙어 있어 이대로 머지해도 사이트에 나가지 않습니다.

            ### 검수 방법
            1. `data.csv` 의 `연예인_en` 열에서 `?` 로 시작하는 값 확인
            2. 맞으면 `?` 를 지우고, 틀리면 비우거나 직접 고칩니다
            3. 확신이 없으면 `?` 그대로 두기 (빌드에서 무시됨)

            책 영문 제목은 이 PR이 아니라 편집기의 🔤 영문 제목 검수에서 합니다.
          branch: enrich/en-suggestions
          delete-branch: true
          base: ${{ github.ref_name }}
