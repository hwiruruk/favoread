name: Update Site Data

on:
  push:
    paths:
      - 'data.csv'
      # 메인 고정 "요즘 핫한 사람" 목록 — 정적 마크업을 다시 넣어야 한다
      - 'data/featured.json'
      # 책등 이미지 URL — 책장 페이지와 data.json에 다시 박아야 한다
      # (tools/fetch_spines.py 가 채운다)
      - 'data/spines.json'
      # 영문 제목 검수 결과 — 승인한 제목이 영문 페이지에 나간다
      # (편집기의 '🔤 영문 제목 검수' 창이 저장한다)
      - 'data/titles_en.json'
      # 페이지 생성기 자체 — 화면 구성을 바꾸면 모든 페이지를 다시 만들어야 한다
      - 'generate.py'
      - '.github/workflows/update-sitemap.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v5
        with:
          # lastmod 정확도를 위해 git 히스토리 전체 필요
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Run generator
        run: python3 generate.py

      - name: Commit & push
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A data.json sitemap.xml share/ en/ s/ data/shortlinks.json index.html updates.html robots.txt feed.xml
          git diff --cached --quiet || git commit -m "chore: data.json·sitemap·share·index·en·s 자동 갱신 [$(date +%Y-%m-%d)]"
          git push
