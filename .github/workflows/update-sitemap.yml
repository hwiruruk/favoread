name: Update Site Data

on:
  push:
    paths:
      - 'data.csv'
      # 메인 고정 "요즘 핫한 사람" 목록 — 정적 마크업을 다시 넣어야 한다
      - 'data/featured.json'
      # 책등 이미지 URL — 책장 페이지와 data.json에 다시 박아야 한다
      # (tools/fetch_spines.py 가 채운다)
      - 'data/spines.json'
      # 영문 제목 검수 결과 — 승인한 제목이 영문 페이지에 나간다
      # (편집기의 '🔤 영문 제목 검수' 창이 저장한다)
      - 'data/titles_en.json'
      # 코멘트 검수 결과 — 승인한 코멘트가 셀럽 모달에 나간다
      # (편집기의 '💬 코멘트 검수' 창이 저장한다)
      - 'data/comments.json'
      # 그룹 공식 색 — 그룹 박스 색이 바뀐다
      - 'data/group_colors.json'
      # 페이지 생성기 자체 — 화면 구성을 바꾸면 모든 페이지를 다시 만들어야 한다
      - 'generate.py'
      - '.github/workflows/update-sitemap.yml'

# 편집기로 저장하면 이 워크플로와 영문 제목 후보 워크플로가 동시에 돌고,
# 커밋이 연달아 올라오면 이 워크플로도 여러 번 겹쳐 돈다. 같은 브랜치에서는
# 하나씩 차례로 돌게 한다 (중간 것을 취소하지 않는다 — 각 커밋의 변경이 다 반영돼야 한다).
concurrency:
  group: update-site-data-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v5
        with:
          # lastmod 정확도를 위해 git 히스토리 전체 필요
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Run generator
        run: python3 generate.py

      - name: Commit & push
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          commit() {
            git add -A data.json sitemap.xml share/ group/ en/ s/ data/shortlinks.json data/en_slugs.json data/page_lastmod.json data/detail/ index.html updates.html robots.txt feed.xml
            git diff --cached --quiet || git commit -m "chore: data.json·sitemap·share·index·en·s 자동 갱신 [$(date +%Y-%m-%d)]"
          }
          commit
          # 도는 사이에 다른 커밋(편집기 저장, 영문 제목 후보 봇)이 먼저 올라가면 push가
          # 거절된다. 생성 파일은 rebase로 합치면 충돌하므로, 최신 상태를 받아 처음부터
          # 다시 만들어 올린다.
          for i in 1 2 3 4; do
            git push origin "HEAD:${GITHUB_REF_NAME}" && exit 0
            echo "push 거절 — 최신 커밋을 받아 다시 생성합니다 ($i)"
            sleep $((i * 5))
            git fetch origin "${GITHUB_REF_NAME}"
            git reset --hard "origin/${GITHUB_REF_NAME}"
            python3 generate.py
            commit
          done
          exit 1

      # 내용이 바뀐 셀럽·책 페이지를 빙·네이버 등에 IndexNow로 알린다 (구글은 미참여).
      # 사이트가 올라가는 main에서만, 이번에 생성 커밋을 올렸을 때만 보낸다.
      # 실패해도 사이트 갱신에는 영향이 없다.
      - name: Notify IndexNow
        if: github.ref == 'refs/heads/main'
        continue-on-error: true
        run: |
          if [ "$(git log -1 --format=%ae)" = "github-actions[bot]@users.noreply.github.com" ]; then
            # GitHub Pages에 새 페이지가 올라갈 시간을 준다
            sleep 90
            python3 tools/indexnow_ping.py HEAD^ HEAD
          else
            echo "생성 커밋이 없어 건너뜀"
          fi
