name: Fetch Book Subjects

# '책 취향' 통계(셀럽 페이지의 📊 독서 취향)에 쓸 책 분야(KDC)를
# 국립중앙도서관·도서관 정보나루에서 받아 data/subjects.json 에 채운다. 설명은 tools/TASTE.md.
#
# 자동으로 돈다 — 분야를 모르는 책이 10권 넘게 쌓였을 때만 조회한다.
# 도서관 정보나루는 하루 호출 한도가 있어서 한 번에 400권씩만 받는다 (책 한 권에 1번 부른다).
# 처음엔 1,600권이 넘으니 매일 조금씩 채워진다 (손으로 여러 번 돌려도 된다).
#
# 손으로 돌리기: Actions → Fetch Book Subjects → Run workflow
#
# 미리 넣어둘 Secret (Settings → Secrets and variables → Actions):
#   NL_API_KEY        국립중앙도서관 Open API 인증키 (ISBN 서지정보·소장자료 검색)
#   NL_SEARCH_KEY     소장자료 검색 키가 따로 발급됐을 때만 (없으면 NL_API_KEY 를 쓴다)
#   LIBRARY_API_KEY   도서관 정보나루(data4library.kr) 인증키
#   YES24_PROXY 또는 YES24_API_KEY   ISBN을 받을 때 쓴다 (책등·책 정보 워크플로와 같은 값)
# 도서관 키는 둘 중 하나만 있어도 돈다. 나중에 다른 하나를 넣으면 그 기관 정보만 마저 받는다.

on:
  workflow_dispatch:
    inputs:
      limit:
        description: '이번에 조회할 책 수 (0 = 전부). 정보나루 하루 한도 때문에 400 정도가 안전'
        required: false
        default: '400'
        type: string
      refresh:
        description: '지난번에 못 찾은 책도 다시 조회'
        required: false
        default: false
        type: boolean
  schedule:
    # 매일 03:47 UTC (KST 12:47) — 책 정보 워크플로(12:17) 뒤에
    - cron: '47 3 * * *'

env:
  MIN_BATCH: 10   # 분야를 모르는 책이 이 권수 이상 모이면 자동 실행
  AUTO_LIMIT: 400 # 자동 실행 때 한 번에 조회할 책 수

jobs:
  subjects:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      # 아직 머지 안 한 지난 PR이 있으면 거기 받아둔 것부터 이어서 받는다 (같은 책을 또 받지 않게)
      - name: 머지 전 PR의 결과 이어받기
        run: |
          if git fetch --depth=1 origin chore/subjects 2>/dev/null; then
            git checkout FETCH_HEAD -- data/subjects.json 2>/dev/null && echo "chore/subjects 의 data/subjects.json 에서 이어서 받습니다." || true
          fi

      - name: 조회할 책이 충분히 모였는지 확인
        id: gate
        env:
          NL_API_KEY: ${{ secrets.NL_API_KEY }}
          NL_SEARCH_KEY: ${{ secrets.NL_SEARCH_KEY }}
          LIBRARY_API_KEY: ${{ secrets.LIBRARY_API_KEY }}
        run: |
          if [ -z "$NL_API_KEY" ] && [ -z "$LIBRARY_API_KEY" ]; then
            if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
              echo "::error::NL_API_KEY 나 LIBRARY_API_KEY Secret이 없습니다. (Settings → Secrets and variables → Actions)"
              exit 1
            fi
            echo "도서관 API 키가 아직 없어 건너뜁니다."
            echo "run=false" >> $GITHUB_OUTPUT
            exit 0
          fi
          ARGS=""
          if [ "${{ github.event.inputs.refresh }}" = "true" ]; then ARGS="--refresh"; fi
          N=$(python3 tools/fetch_subjects.py --count $ARGS)
          echo "분야를 모르는 책: ${N}권 (자동 실행 기준 ${MIN_BATCH}권)"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "$N" -gt 0 ]; then
            echo "run=true" >> $GITHUB_OUTPUT
          elif [ "$N" -ge "$MIN_BATCH" ]; then
            echo "run=true" >> $GITHUB_OUTPUT
          else
            echo "run=false" >> $GITHUB_OUTPUT
            echo "기준 미달 — 이번엔 건너뜁니다."
          fi

      - name: 분야 받기
        if: steps.gate.outputs.run == 'true'
        env:
          NL_API_KEY: ${{ secrets.NL_API_KEY }}
          NL_SEARCH_KEY: ${{ secrets.NL_SEARCH_KEY }}
          LIBRARY_API_KEY: ${{ secrets.LIBRARY_API_KEY }}
          YES24_PROXY: ${{ secrets.YES24_PROXY }}
          YES24_API_KEY: ${{ secrets.YES24_API_KEY }}
        run: |
          if [ -z "$YES24_PROXY" ] && [ -z "$YES24_API_KEY" ]; then
            echo "::error::YES24_PROXY 또는 YES24_API_KEY Secret이 없습니다. ISBN을 받을 때 필요합니다."
            exit 1
          fi
          LIMIT="${{ github.event.inputs.limit }}"
          if [ -z "$LIMIT" ]; then LIMIT="$AUTO_LIMIT"; fi
          ARGS=""
          if [ "$LIMIT" != "0" ]; then ARGS="$ARGS --limit $LIMIT"; fi
          if [ "${{ github.event.inputs.refresh }}" = "true" ]; then ARGS="$ARGS --refresh"; fi
          python3 tools/fetch_subjects.py $ARGS

      - name: 바뀐 게 있는지 확인
        if: steps.gate.outputs.run == 'true'
        id: diff
        run: |
          if git diff --quiet -- data/subjects.json && [ -z "$(git ls-files --others --exclude-standard data/subjects.json)" ]; then
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            echo "changed=true" >> $GITHUB_OUTPUT
          fi

      - name: PR 만들기
        if: steps.diff.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v8
        with:
          commit-message: "chore: 책 분야 수집 (독서 취향 통계용)"
          title: "chore: 책 분야 수집 (독서 취향 통계용)"
          body: |
            ## 책 분야 수집

            `tools/fetch_subjects.py` 가 국립중앙도서관·도서관 정보나루에서 받은 책 분야(KDC)입니다.
            바뀐 파일은 `data/subjects.json` 하나예요.
            머지하면 사이트 갱신 워크플로가 돌면서 셀럽 페이지 📊 독서 취향에 분야 줄이 붙습니다.

            ### 확인할 것
            - `kdc` 로 분야를 정합니다. 몇 권 훑어보고 틀린 게 있으면 그 책의 `kdc` 를 고쳐 주세요
              (813 소설 · 811 시 · 814 에세이 · 1xx 인문 · 325 경영 · 199 자기계발 …, 표는 tools/TASTE.md)
            - `kdc_from` — 어디서 온 분류인지 (d4l 정보나루 · nlh 국립중앙도서관 소장자료 청구기호 · nl 국립중앙도서관 ISBN 서지정보 · add_code 부가기호)
            - `misses` — 예스24에 ISBN이 없거나 도서관 데이터에 없는 책. 그 책은 분야 통계에서 빠집니다
          branch: chore/subjects
          delete-branch: true
          base: ${{ github.ref_name }}
