name: Fetch Book Comments

# 출처를 직접 읽어서 "왜 이 책을 추천했는지"를 뽑아 data/comments.json 에 채운다.
# GitHub 웹에서 Actions → 이 워크플로 → "Run workflow" 버튼으로 돌린다.
# 터미널도, 파이썬 설치도 필요 없다. 결과는 PR로 올라온다.
#
# 미리 넣어둬야 할 Secret (Settings → Secrets and variables → Actions):
#   ANTHROPIC_API_KEY   https://console.anthropic.com 에서 발급
#
# 만들어진 초안은 전부 검수 대기 상태다. 편집기(/editor/)의 "💬 코멘트 검수"
# 창에서 원문과 대조해 승인해야 사이트에 나간다.
# 자세한 설명은 tools/COMMENTS.md 참고.

on:
  workflow_dispatch:
    inputs:
      limit:
        description: '이번에 읽을 출처 수 (0 = 전부). 처음엔 5 정도로 시험해 보세요'
        required: false
        default: '5'
      dry_run:
        description: '연습 모드 — 결과만 보고 파일은 안 바꿈'
        required: false
        default: true
        type: boolean
      refresh:
        description: '지난번에 못 읽은 출처도 다시 조회'
        required: false
        default: false
        type: boolean
      max_books:
        description: '한 출처가 이 권수를 넘게 담고 있으면 건너뜀 (목록글에는 이유가 없음)'
        required: false
        default: '3'
      effort:
        description: '모델이 들이는 공 (low로 충분합니다)'
        required: false
        default: 'low'
        type: choice
        options: [low, medium, high]

jobs:
  comments:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 키가 들어있는지 확인
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "::error::ANTHROPIC_API_KEY Secret이 없습니다."
            echo "::error::Settings → Secrets and variables → Actions 에서 추가하세요. (tools/COMMENTS.md 참고)"
            exit 1
          fi

      - name: 준비
        run: pip install --quiet anthropic

      - name: 출처 읽고 코멘트 초안 만들기
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          ARGS="--max-books ${{ github.event.inputs.max_books }} --effort ${{ github.event.inputs.effort }}"
          LIMIT="${{ github.event.inputs.limit }}"
          if [ -n "$LIMIT" ] && [ "$LIMIT" != "0" ]; then ARGS="$ARGS --limit $LIMIT"; fi
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then ARGS="$ARGS --dry-run"; fi
          if [ "${{ github.event.inputs.refresh }}" = "true" ]; then ARGS="$ARGS --refresh"; fi
          echo "실행: python3 tools/fetch_comments.py $ARGS"
          python3 tools/fetch_comments.py $ARGS

      - name: 바뀐 게 있는지 확인
        id: diff
        run: |
          if git diff --quiet -- data/comments.json; then
            echo "changed=false" >> $GITHUB_OUTPUT
            echo "바뀐 내용이 없습니다 (연습 모드였거나 새로 찾은 게 없음)."
          else
            echo "changed=true" >> $GITHUB_OUTPUT
          fi

      - name: PR 만들기
        if: steps.diff.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: "chore: 코멘트 초안 갱신 (검수 필요)"
          title: "chore: 코멘트 초안 갱신 (검수 필요)"
          body: |
            ## 코멘트 초안 갱신

            `tools/fetch_comments.py` 가 출처를 직접 읽고 뽑아낸 추천 이유 초안입니다.
            바뀐 파일은 `data/comments.json` 하나뿐이에요.

            ### 중요 — 이대로 머지해도 사이트에는 안 나갑니다
            새 항목은 전부 `status: "pending"` 입니다. 편집기의
            **💬 코멘트 검수** 창에서 출처와 대조해 승인한 것만 노출됩니다.
            그러니 먼저 머지하고 검수는 천천히 하셔도 됩니다.

            ### 보는 법
            - `comments` — 뽑아낸 초안. `quote` 에 근거가 된 원문 문장이 들어 있어
              원문을 안 열어도 1차로 걸러낼 수 있습니다
            - `grade` — `A` 는 원문에 추천 이유가 있는 것, `B` 는 관계만 확인된 것
            - `misses` — 못 읽었거나 그 책 얘기가 없던 출처와 이유.
              다음 실행 때 건너뜁니다 (`refresh` 를 켜면 다시 시도)

            ### 이상한 문장이 있으면
            편집기에서 **반려**하세요. 항목은 남지만 노출되지 않고,
            다음 실행 때 같은 문장을 다시 올리지 않습니다.
          branch: chore/comments
          delete-branch: true
          base: ${{ github.ref_name }}
